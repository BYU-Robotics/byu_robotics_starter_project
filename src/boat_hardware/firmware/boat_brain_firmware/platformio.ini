; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = boat_brain_firmware

[env:boat_brain_firmware]
platform = espressif32
board = lolin32_lite
framework = arduino
monitor_speed = 921600
board_microros_transport = serial
board_microros_distro = jazzy
lib_deps = 
	https://github.com/micro-ROS/micro_ros_platformio.git
	https://github.com/mprograms/QMC5883LCompass.git
	adafruit/Adafruit MPU6050 @ ^2.2.6
	adafruit/Adafruit Unified Sensor @ ^1.1.14

[env:gyro_calibration]
platform = espressif32
board = lolin32_lite
framework = arduino
monitor_speed = 115200
build_src_filter = +<../tools/gyro_calibration/*>-<./src>
lib_deps = 
	adafruit/Adafruit MPU6050 @ ^2.2.6
	adafruit/Adafruit Unified Sensor @ ^1.1.14

